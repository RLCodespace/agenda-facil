services:
  db:
    image: postgres:17-alpine
    container_name: agendafacil_test_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${TEST_DB_NAME:-agendafacil_test}
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    volumes:
      - agendafacil_test_db_data:/var/lib/postgresql/data
      # Roda na primeira inicialização do volume: extensões + shim do auth,
      # e depois aplica todas as migrations reais de supabase/migrations/.
      - ./supabase/docker/init:/docker-entrypoint-initdb.d
      - ./supabase/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:-postgres} -d ${TEST_DB_NAME:-agendafacil_test}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agendafacil_test_db_data: